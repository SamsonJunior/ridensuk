<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>RideNsuk – AI Okada & Keke Ride Hailing</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #fff;
        --tx: #14213d;
        --mu: #5b6478;
        --br: #e2e6ef;
        --brand: #0b7a53;
        --brand2: #e9a100;
        --ok: #22a06b;
        --warn: #e9a100;
        --bad: #d64545;
        --sh: 0 6px 24px rgba(20, 33, 61, 0.08);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1420;
          --card: #171f2e;
          --tx: #e8ecf5;
          --mu: #98a2b8;
          --br: #26304a;
          --sh: 0 6px 24px rgba(0, 0, 0, 0.4);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1420;
        --card: #171f2e;
        --tx: #e8ecf5;
        --mu: #98a2b8;
        --br: #26304a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      a {
        color: var(--brand);
        text-decoration: none;
      }
      h1,
      h2,
      h3 {
        line-height: 1.2;
        margin: 0 0 0.5rem;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--card);
        border-bottom: 1px solid var(--br);
      }
      nav {
        max-width: 1150px;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.7rem 1rem;
        flex-wrap: wrap;
      }
      .logo {
        font-weight: 800;
        font-size: 1.15rem;
        color: var(--tx);
        margin-right: auto;
      }
      .logo b {
        color: var(--brand);
      }
      main {
        max-width: 1150px;
        margin: auto;
        padding: 1rem;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 0.65rem 1.1rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: var(--brand);
        color: #fff;
        display: inline-block;
      }
      .btn.ghost {
        background: transparent;
        color: var(--tx);
        border: 1px solid var(--br);
      }
      .btn.sm {
        padding: 0.35rem 0.7rem;
        font-size: 0.85rem;
      }
      .btn.bad {
        background: var(--bad);
      }
      .btn.warn {
        background: var(--brand2);
        color: #1c1500;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--br);
        border-radius: 16px;
        padding: 1.1rem;
        box-shadow: var(--sh);
        margin-bottom: 1rem;
      }
      .hero {
        display: grid;
        gap: 2rem;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: center;
        padding: 2rem 0;
      }
      .hero h1 {
        font-size: clamp(1.9rem, 5vw, 3rem);
      }
      .hero p {
        color: var(--mu);
        font-size: 1.05rem;
      }
      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      }
      .dash {
        display: grid;
        gap: 1rem;
        grid-template-columns: minmax(300px, 380px) 1fr;
        align-items: start;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 0.85rem;
        margin: 0.7rem 0 0.25rem;
      }
      input,
      select {
        width: 100%;
        padding: 0.65rem 0.75rem;
        border-radius: 10px;
        border: 1px solid var(--br);
        background: var(--bg);
        color: var(--tx);
        font: inherit;
      }
      .seg {
        display: flex;
        gap: 0.5rem;
      }
      .seg button {
        flex: 1;
        padding: 0.6rem;
        border-radius: 10px;
        border: 1px solid var(--br);
        background: var(--bg);
        color: var(--tx);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .seg .on {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }
      .stat {
        font-size: 1.7rem;
        font-weight: 800;
      }
      .mu {
        color: var(--mu);
        font-size: 0.88rem;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0;
        border-bottom: 1px solid var(--br);
      }
      .row:last-child {
        border: 0;
      }
      .badge {
        padding: 0.15rem 0.55rem;
        border-radius: 99px;
        font-size: 0.75rem;
        font-weight: 700;
        background: var(--br);
        color: var(--tx);
      }
      .badge.requested {
        background: #fde8b0;
        color: #6b4a00;
      }
      .badge.accepted,
      .badge.ongoing {
        background: #cdeedd;
        color: #0b5d3f;
      }
      .badge.completed {
        background: #d7e4ff;
        color: #1c3f8a;
      }
      .badge.cancelled {
        background: #fbd5d5;
        color: #8a1c1c;
      }
      .map {
        width: 100%;
        height: auto;
        background: var(--bg);
        border: 1px solid var(--br);
        border-radius: 14px;
      }
      .map text {
        fill: var(--tx);
        font-size: 11px;
      }
      .lb {
        opacity: 0.65;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
        min-width: 520px;
      }
      th,
      td {
        text-align: left;
        padding: 0.5rem;
        border-bottom: 1px solid var(--br);
      }
      .prog {
        height: 8px;
        background: var(--br);
        border-radius: 9px;
        overflow: hidden;
        margin: 0.5rem 0;
      }
      .prog i {
        display: block;
        height: 100%;
        background: var(--brand);
        transition: width 0.8s;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--tx);
        color: var(--bg);
        padding: 0.6rem 1rem;
        border-radius: 10px;
        opacity: 0;
        transition: 0.3s;
        pointer-events: none;
        z-index: 9;
      }
      #toast.on {
        opacity: 1;
      }
      .auth {
        width: 100%;
        max-width: 440px;
        margin: 1.5rem auto;
      }
      .auth h2 {
        text-align: center;
      }
      /* center the login / create-account card in the middle of the screen */
      main:has(> .auth) {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 140px);
        min-height: calc(100dvh - 140px);
      }
      .err {
        color: var(--bad);
        font-size: 0.85rem;
        min-height: 1.2em;
      }
      footer {
        text-align: center;
        color: var(--mu);
        font-size: 0.8rem;
        padding: 1.5rem;
      }
      @media (max-width: 820px) {
        .hero,
        .dash {
          grid-template-columns: 1fr;
        }
        .lb {
          display: none;
        }
      }
      #lm {
        height: 430px;
        border-radius: 14px;
        position: relative;
        z-index: 0;
        isolation: isolate;
      }
    </style>
  </head>
  <body>
    <header><nav id="nav"></nav></header>
    <main id="app"></main>
    <footer>
      RideNsuk · Okada &amp; Keke ride hailing · Final-year project
      prototype
    </footer>
    <div id="toast"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s).replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
      const DB = { users: [], rides: [], me: null },
        uid = () => Math.random().toString(36).slice(2, 10);
      const toast = (m) => {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("on");
        setTimeout(() => t.classList.remove("on"), 2800);
      };
      const auth = firebase.auth(),
        fs = firebase.firestore();
      let last = {},
        un = [],
        mine = null,
        ready = 0,
        W = 0,
        LM,
        L1;
      const RC = {},
        S = { from: null, to: null, type: "Okada", route: null };
      const save = () =>
        ["users", "rides"].forEach((c) =>
          DB[c].forEach((o) => {
            const j = JSON.stringify(o);
            if (last[c + o.id] !== j) {
              last[c + o.id] = j;
              fs.collection(c)
                .doc(o.id)
                .set(o)
                .catch((e) => toast("Save failed: " + e.code));
            }
          }),
        );
      const snap = (c, q) =>
        un.push(
          q.onSnapshot(
            (s) => {
              DB[c] = s.docs.map((d) => {
                const o = { ...d.data(), id: d.id };
                last[c + o.id] = JSON.stringify(o);
                return o;
              });
              if (
                c == "users" &&
                mine &&
                !DB.users.some((u) => u.id == mine.id)
              )
                DB.users.push(mine);
              refresh();
            },
            (e) => toast("Sync error: " + e.code),
          ),
        );
      /* geo, routing (OSRM), fares, matching */
      const SP = { Okada: 30, Keke: 22 },
        FR = { Okada: [200, 150], Keke: [250, 120] },
        naira = (n) => "₦" + n.toLocaleString(),
        RAD = Math.PI / 180;
      const hav = (a, b) => {
        const x =
          Math.sin(((b[0] - a[0]) * RAD) / 2) ** 2 +
          Math.cos(a[0] * RAD) *
            Math.cos(b[0] * RAD) *
            Math.sin(((b[1] - a[1]) * RAD) / 2) ** 2;
        return 12742 * Math.asin(Math.sqrt(x));
      };
      const rush = () => {
          const h = new Date().getHours();
          return (h >= 7 && h < 10) || (h >= 16 && h < 20);
        },
        fare = (t, km) =>
          Math.round(((FR[t][0] + FR[t][1] * km) * (rush() ? 1.15 : 1)) / 50) *
          50;
      async function osrm(a, b) {
        try {
          const x = (
            await (
              await fetch(
                `https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`,
              )
            ).json()
          ).routes[0];
          return {
            km: x.distance / 1000,
            pts: x.geometry.coordinates.map((c) => [c[1], c[0]]),
          };
        } catch (e) {
          return { km: hav(a, b) * 1.3, pts: [a, b] };
        }
      }
      const match = (t, p) =>
        DB.users
          .filter(
            (r) =>
              r.role == "rider" &&
              r.type == t &&
              r.on &&
              r.ver &&
              r.lat != null &&
              !busy(r),
          )
          .map((r) => ({
            r,
            eta: Math.max(
              1,
              Math.round(((hav([r.lat, r.lng], p) * 1.3) / SP[t]) * 60),
            ),
          }))
          .sort((a, b) => a.eta - b.eta || b.r.rating - a.r.rating)
          .slice(0, 5);
      const me = () => DB.users.find((u) => u.id == DB.me),
        ACT = ["requested", "accepted", "ongoing"],
        busy = (r) => DB.rides.some((x) => x.rid == r.id && ACT.includes(x.st)),
        lb = (p) => p[0].toFixed(4) + ", " + p[1].toFixed(4);
      /* auth + realtime sync */
      auth.onAuthStateChanged((u) => {
        un.forEach((f) => f());
        un = [];
        mine = null;
        DB.users = [];
        DB.rides = [];
        DB.me = u ? u.uid : null;
        if (!u) {
          ready = 1;
          return render();
        }
        un.push(
          fs
            .collection("users")
            .doc(u.uid)
            .onSnapshot((d) => {
              if (!d.exists) return;
              mine = { ...d.data(), id: d.id };
              last["users" + mine.id] = JSON.stringify(mine);
              const i = DB.users.findIndex((x) => x.id == mine.id);
              i < 0 ? DB.users.push(mine) : (DB.users[i] = mine);
              if (!un.s) {
                un.s = 1;
                if (mine.role == "admin") {
                  snap("users", fs.collection("users"));
                  snap("rides", fs.collection("rides"));
                } else {
                  snap(
                    "users",
                    fs.collection("users").where("role", "==", "rider"),
                  );
                  snap(
                    "rides",
                    fs
                      .collection("rides")
                      .where(
                        mine.role == "rider" ? "rid" : "pid",
                        "==",
                        mine.id,
                      ),
                  );
                }
              }
              ready = 1;
              if (
                ["login", "register"].includes((location.hash || "").slice(2))
              )
                location.hash = "#/" + mine.role;
              refresh();
            }),
        );
      });
      async function login() {
        try {
          await auth.signInWithEmailAndPassword(
            $("#e").value.trim(),
            $("#p").value,
          );
        } catch (e) {
          $("#er").textContent = "Invalid email or password.";
        }
      }
      async function reg() {
        const g = (i) => $("#" + i).value.trim(),
          ro = g("ro"),
          e = g("e").toLowerCase(),
          er = (m) => ($("#er").textContent = m);
        if (g("n").length < 3) return er("Enter your full name.");
        if (!/^\S+@\S+\.\S+$/.test(e)) return er("Enter a valid email.");
        if (!/^0\d{10}$/.test(g("ph")))
          return er("Phone must be 11 digits starting with 0.");
        if (g("p").length < 6)
          return er("Password must be at least 6 characters.");
        if (ro == "rider" && g("pl").length < 4)
          return er("Enter the vehicle plate number.");
        try {
          const c = await auth.createUserWithEmailAndPassword(e, g("p"));
          await fs
            .collection("users")
            .doc(c.user.uid)
            .set({
              id: c.user.uid,
              role: ro,
              name: g("n"),
              email: e,
              phone: g("ph"),
              ...(ro == "rider"
                ? {
                    type: g("t"),
                    plate: g("pl").toUpperCase(),
                    on: false,
                    ver: false,
                    lat: null,
                    lng: null,
                    rating: 5,
                  }
                : {}),
            });
        } catch (x) {
          er(
            x.code == "auth/email-already-in-use"
              ? "Email already registered."
              : x.message,
          );
        }
      }
      async function out() {
        if (W) {
          navigator.geolocation.clearWatch(W);
          W = 0;
        }
        const u = me();
        if (u && u.role == "rider")
          await fs
            .collection("users")
            .doc(u.id)
            .update({ on: false })
            .catch(() => {});
        await auth.signOut();
        location.hash = "#/";
      }
      function nav() {
        const u = me();
        $("#nav").innerHTML =
          `<a class="logo" href="#/">Ride<b>Nsuk</b></a>` +
          (u
            ? `<span class="mu">${esc(u.name)} <span class="badge">${u.role}</span></span><a class="btn ghost sm" href="#/${u.role}">Dashboard</a><button class="btn sm" onclick="out()">Log out</button>`
            : `<a class="btn ghost sm" href="#/login">Log in</a><a class="btn sm" href="#/register">Sign up</a>`);
      }
      function render() {
        nav();
        const h = (location.hash || "#/").slice(2),
          u = me(),
          pr = ["passenger", "rider", "admin"].includes(h);
        if (!ready || (pr && DB.me && !u)) {
          $("#app").innerHTML = '<p class="mu">Loading…</p>';
          return;
        }
        if (pr && (!u || u.role != h)) {
          location.hash = u ? "#/" + u.role : "#/login";
          return;
        }
        $("#app").innerHTML = (
          {
            "": vHome,
            login: vLogin,
            register: vReg,
            passenger: shell,
            rider: shell,
            admin: vAdmin,
          }[h] || vHome
        )();
        if ($("#lm")) {
          initMap();
          upd();
          if (u.role == "rider" && u.on) startGps();
        }
      }
      addEventListener("hashchange", render);
      const refresh = () => ($("#lm") && LM ? (nav(), upd()) : render());
      const shell = () =>
        `<div class="dash"><div class="card" id="pp"></div><div class="card"><div id="lm"></div><p class="mu">Map © OpenStreetMap contributors · routing by OSRM</p></div></div><div class="card"><h3>Trip history</h3><div id="hist"></div></div>`;
      function initMap() {
        LM = L.map("lm").setView([8.8466, 7.8736], 13);
        (() => {
          const t = L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            { maxZoom: 19, attribution: "© OpenStreetMap contributors" },
          );
          let f = 0;
          t.on("tileerror", () => {
            if (f) return;
            f = 1;
            LM.removeLayer(t);
            L.tileLayer(
              "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
              { maxZoom: 19, attribution: "Tiles © Esri" },
            ).addTo(LM);
          });
          return t;
        })().addTo(LM);
        L1 = L.layerGroup().addTo(LM);
        LM.on("click", mapClick);
      }
      const pin = (p, c, t) =>
          p &&
          L.circleMarker(p, { radius: 9, color: c, fillOpacity: 0.9 })
            .bindTooltip(t, { permanent: true })
            .addTo(L1),
        rm = (r) =>
          r &&
          r.lat != null &&
          L.marker([r.lat, r.lng], {
            icon: L.divIcon({
              html:
                '<span style="font-size:24px">' +
                (r.type == "Okada" ? "" : "") +
                "</span>",
              className: "",
              iconSize: [28, 28],
            }),
          })
            .addTo(L1)
            .bindTooltip(r.name);
      function line(a) {
        if (RC[a.id])
          L.polyline(RC[a.id].pts, { color: "#0b7a53", weight: 6 }).addTo(L1);
        else {
          RC[a.id] = 1;
          osrm(a.from, a.to).then((r) => {
            RC[a.id] = r;
            upd();
          });
        }
      }
      function upd() {
        const u = me();
        if (!u || !LM || !$("#pp")) return;
        L1.clearLayers();
        const el = $("#pp"),
          mr = DB.rides.filter(
            (r) => r[u.role == "rider" ? "rid" : "pid"] == u.id,
          ),
          a = mr.find(
            (r) =>
              ACT.includes(r.st) &&
              (u.role == "passenger" || r.st != "requested"),
          );
        $("#hist").innerHTML = ridesTable(
          mr.slice().reverse(),
          u.role == "rider" ? "Passenger" : "Rider",
        );
        if (a) {
          const d = DB.users.find((x) => x.id == a.rid) || {
            name: "Rider",
            plate: "",
            type: a.type,
          };
          pin(a.from, "#0b7a53", "Pickup");
          pin(a.to, "#d64545", "Drop-off");
          rm(d);
          if (RC[a.id] && RC[a.id] !== 1) line(a);
          else if (!RC[a.id]) line(a);
          if (u.role == "passenger")
            el.innerHTML = `<h3>Your ride <span class="badge ${a.st}">${a.st}</span></h3><p>${{ requested: "Waiting for the rider to accept…", accepted: "Rider accepted and is on the way.", ongoing: "Trip in progress." }[a.st]}</p><div class="row"><span>Rider</span><b>${esc(d.name)}</b></div><div class="row"><span>Plate</span><b>${esc(d.plate)}</b></div><div class="row"><span>Fare</span><b>${naira(a.fare)}</b></div>${a.st != "ongoing" ? `<button class="btn bad" onclick="setSt('${a.id}','cancelled')">Cancel ride</button>` : ""}`;
          else
            el.innerHTML = `<h3>Active trip <span class="badge ${a.st}">${a.st}</span></h3><p>${esc(a.fn)} → ${esc(a.tn)}<br>${naira(a.fare)} · ${a.km.toFixed(1)} km · ${esc(a.pn)}</p>${a.st == "accepted" ? `<button class="btn" onclick="setSt('${a.id}','ongoing')">Start trip</button>` : `<button class="btn warn" onclick="setSt('${a.id}','completed')">Complete trip</button>`}`;
          return;
        }
        if (u.role == "rider") {
          const inc = mr.filter((r) => r.st == "requested"),
            done = mr.filter((r) => r.st == "completed");
          rm(u);
          el.innerHTML = `<h3>Rider dashboard</h3><div class="row"><span>Vehicle</span><b>${u.type} · ${esc(u.plate)}</b></div><div class="row"><span>Earnings</span><b>${naira(done.reduce((s, r) => s + r.fare, 0))}</b></div>${u.ver ? "" : '<p class="err">Awaiting admin verification – you will not receive requests yet.</p>'}<p class="mu">${u.lat == null ? "Location not set. Use GPS or tap the map." : "Location: " + lb([u.lat, u.lng]) + " (tap the map to correct it)"}</p><button class="btn ${u.on ? "bad" : ""}" onclick="toggle()">${u.on ? "Go offline" : "Go online"}</button><h3 style="margin-top:1.2rem">Incoming requests</h3>${inc.map((r) => `<div class="row"><span>${esc(r.fn)} → ${esc(r.tn)}<br><span class="mu">${naira(r.fare)} · ${r.km.toFixed(1)} km</span></span><span><button class="btn sm" onclick="setSt('${r.id}','accepted')">Accept</button> <button class="btn sm ghost" onclick="setSt('${r.id}','cancelled')">Decline</button></span></div>`).join("") || '<p class="mu">No pending requests.</p>'}`;
          return;
        }
        const rt = S.route,
          ms = S.from && rt ? match(S.type, S.from) : [];
        pin(S.from, "#0b7a53", "Pickup");
        pin(S.to, "#d64545", "Drop-off");
        if (rt) L.polyline(rt.pts, { color: "#0b7a53", weight: 6 }).addTo(L1);
        DB.users
          .filter((r) => r.role == "rider" && r.on && r.ver && r.type == S.type)
          .forEach(rm);
        el.innerHTML =
          `<h3>Request a ride</h3><p class="mu">Tap the map to set pickup, then drop-off.</p><button class="btn ghost sm" onclick="gps()">Use my location</button><label>Transport</label><div class="seg">${["Okada", "Keke"].map((t) => `<button class="${S.type == t ? "on" : ""}" onclick="S.type='${t}';upd()">${t == "Okada" ? "" : ""} ${t}</button>`).join("")}</div>` +
          (rt
            ? `<div style="margin-top:1rem"><div class="row"><span>Distance</span><b>${rt.km.toFixed(1)} km</b></div><div class="row"><span>Est. time</span><b>${Math.max(1, Math.round((rt.km / SP[S.type]) * 60))} min</b></div><div class="row"><span>Est. fare</span><b class="stat">${naira(fare(S.type, rt.km))}</b></div>${rush() ? '<p class="mu">Peak-hour surcharge applied.</p>' : ""}</div><h3>Matched riders</h3>${ms.map((m) => `<div class="row"><span>${esc(m.r.name)}<br><span class="mu"> ${m.r.rating} · ${m.eta} min away</span></span><button class="btn sm" onclick="request('${m.r.id}')">Request</button></div>`).join("") || '<p class="mu">No verified riders online nearby.</p>'}`
            : S.from
              ? '<p class="mu">Now tap your drop-off point…</p>'
              : "");
      }
      function mapClick(e) {
        const u = me(),
          p = [+e.latlng.lat.toFixed(5), +e.latlng.lng.toFixed(5)];
        if (u.role == "rider") {
          u.lat = p[0];
          u.lng = p[1];
          save();
          return upd();
        }
        if (
          u.role != "passenger" ||
          DB.rides.some((r) => r.pid == u.id && ACT.includes(r.st))
        )
          return;
        if (!S.from || S.to) {
          S.from = p;
          S.to = null;
          S.route = null;
          upd();
        } else {
          S.to = p;
          upd();
          osrm(S.from, S.to).then((r) => {
            S.route = r;
            upd();
          });
        }
      }
      const gps = () =>
        navigator.geolocation
          ? navigator.geolocation.getCurrentPosition(
              (p) => {
                S.from = [
                  +p.coords.latitude.toFixed(5),
                  +p.coords.longitude.toFixed(5),
                ];
                S.to = null;
                S.route = null;
                LM.setView(S.from, 15);
                upd();
              },
              () => toast("Location blocked – tap the map instead"),
            )
          : toast("GPS not supported");
      function startGps() {
        if (W || !navigator.geolocation) return;
        W = navigator.geolocation.watchPosition(
          (p) => {
            const u = me();
            if (!u || Date.now() - (u.lt || 0) < 5000) return;
            u.lt = Date.now();
            u.lat = +p.coords.latitude.toFixed(5);
            u.lng = +p.coords.longitude.toFixed(5);
            save();
            upd();
          },
          () => toast("GPS unavailable – tap the map to set your location"),
          { enableHighAccuracy: true },
        );
      }
      function toggle() {
        const u = me();
        if (!u.on && u.lat == null)
          (startGps(), toast("Set your location first (GPS or tap the map)"));
        if (!u.on && u.lat == null) return;
        u.on = !u.on;
        save();
        if (u.on) startGps();
        upd();
      }
      function request(id) {
        const u = me();
        DB.rides.push({
          id: uid(),
          pid: u.id,
          pn: u.name,
          rid: id,
          type: S.type,
          from: S.from,
          to: S.to,
          fn: lb(S.from),
          tn: lb(S.to),
          km: +S.route.km.toFixed(2),
          fare: fare(S.type, S.route.km),
          st: "requested",
          ts: Date.now(),
        });
        S.from = S.to = S.route = null;
        save();
        toast("Ride requested");
        upd();
      }
      function setSt(id, st) {
        const r = DB.rides.find((x) => x.id == id);
        r.st = st;
        r.ts = Date.now();
        save();
        upd();
      }
      async function forgot() {
        const e = $("#e").value.trim().toLowerCase();
        if (!/^\S+@\S+\.\S+$/.test(e))
          return ($("#er").textContent =
            "Type your email in the box above first, then click Forgot password.");
        try {
          await auth.sendPasswordResetEmail(e);
          $("#er").textContent = "";
          toast(
            "If that email has an account, a reset link has been sent. Check your inbox and spam.",
          );
        } catch (x) {
          $("#er").textContent =
            x.code == "auth/too-many-requests"
              ? "Too many attempts. Try again later."
              : "Could not send reset email. Check the address.";
        }
      }
      /* ---- Views ---- */
      const vHome =
        () => `<section class="hero"><div><h1>Smarter Okada &amp; Keke rides, one tap away.</h1><p>Request a ride, get matched with the nearest verified rider, see the fare before you go, and follow a traffic-aware route in real time.</p><p><a class="btn" href="#/register">Get started</a> <a class="btn ghost" href="#/login">I have an account</a></p></div><div class="card"><div style="font-size:5rem;text-align:center"></div><p class="mu">Real maps, GPS pickup and live rider tracking.</p></div></section>
<h2>What the platform does</h2><div class="grid">${[
          [
            "",
            "Ride requests",
            "Pick a pickup point, destination and Okada or Keke.",
          ],
          [
            "",
            "Intelligent matching",
            "Riders ranked by travel time to you, availability and rating.",
          ],
          [
            "",
            "Route optimisation",
            "Fastest road route drawn on a live OpenStreetMap map.",
          ],
          [
            "",
            "Fare estimation",
            "Transparent distance-based fares shown before you confirm.",
          ],
          [
            "",
            "Rider verification",
            "Only admin-verified riders receive ride requests.",
          ],
          ["", "Admin dashboard", "Monitor users, riders, trips and revenue."],
        ]
          .map(
            (f) =>
              `<div class="card"><div class="stat">${f[0]}</div><h3>${f[1]}</h3><p class="mu">${f[2]}</p></div>`,
          )
          .join("")}</div>`;
      const vLogin = () =>
        `<div class="card auth"><h2>Welcome back</h2><label>Email</label><input id="e" type="email" autocomplete="email"><label>Password</label><input id="p" type="password" autocomplete="current-password"><p class="err" id="er"></p><button class="btn" style="width:100%" onclick="login()">Log in</button><p class="mu" style="margin:.8rem 0 0"><a href="#" onclick="forgot();return false">Forgot password?</a></p><p class="mu">No account? <a href="#/register">Sign up</a></p></div>`;
      const vReg = () =>
        `<div class="card auth"><h2>Create your account</h2><label>Account type</label><select id="ro" onchange="$('#rx').style.display=this.value=='rider'?'block':'none'"><option value="passenger">Passenger</option><option value="rider">Rider</option></select><label>Full name</label><input id="n"><label>Email</label><input id="e" type="email"><label>Phone (e.g. 08012345678)</label><input id="ph" inputmode="numeric"><label>Password (6+ characters)</label><input id="p" type="password" autocomplete="new-password"><div id="rx" style="display:none"><label>Transport type</label><select id="t"><option>Okada</option><option>Keke</option></select><label>Plate number</label><input id="pl"></div><p class="err" id="er"></p><button class="btn" style="width:100%" onclick="reg()">Sign up</button></div>`;
      function ridesTable(l, who) {
        return `<div class="tw"><table><tr><th>Trip</th><th>Type</th><th>Fare</th><th>${who}</th><th>Status</th></tr>${l.map((r) => `<tr><td>${esc(r.fn)} → ${esc(r.tn)}</td><td>${r.type}</td><td>${naira(r.fare)}</td><td>${esc((DB.users.find((u) => u.id == (who == "Rider" ? r.rid : r.pid)) || { name: who == "Rider" ? "-" : r.pn || "-" }).name)}</td><td><span class="badge ${r.st}">${r.st}</span></td></tr>`).join("") || '<tr><td colspan="5" class="mu">No trips yet.</td></tr>'}</table></div>`;
      }
      function vAdmin() {
        const R = DB.users.filter((u) => u.role == "rider"),
          Pa = DB.users.filter((u) => u.role == "passenger"),
          rev = DB.rides
            .filter((r) => r.st == "completed")
            .reduce((a, r) => a + r.fare, 0);
        return `<div class="grid">${[
          ["Passengers", Pa.length],
          ["Riders", R.length],
          ["Total rides", DB.rides.length],
          ["Revenue", naira(rev)],
        ]
          .map(
            (s) =>
              `<div class="card"><div class="mu">${s[0]}</div><div class="stat">${s[1]}</div></div>`,
          )
          .join("")}</div>
<div class="card"><h3>Riders</h3><div class="tw"><table><tr><th>Name</th><th>Type</th><th>Plate</th><th>Phone</th><th>Status</th><th></th></tr>${R.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.type}</td><td>${esc(r.plate)}</td><td>${esc(r.phone)}</td><td>${r.ver ? "Verified" : " Pending"}${r.on ? " · online" : ""}</td><td><button class="btn sm ${r.ver ? "ghost" : ""}" onclick="verify('${r.id}')">${r.ver ? "Revoke" : "Verify"}</button></td></tr>`).join("")}</table></div></div>
<div class="card"><h3>Passengers</h3><div class="tw"><table><tr><th>Name</th><th>Email</th><th>Phone</th></tr>${Pa.map((p) => `<tr><td>${esc(p.name)}</td><td>${esc(p.email)}</td><td>${esc(p.phone)}</td></tr>`).join("") || '<tr><td colspan="3" class="mu">No passengers yet.</td></tr>'}</table></div></div>
<div class="card"><h3>All rides</h3>${ridesTable(DB.rides.slice().reverse(), "Rider")}</div>`;
      }
      const verify = (id) => {
        const r = DB.users.find((u) => u.id == id);
        r.ver = !r.ver;
        save();
        render();
      };
    </script>
  </body>
</html>
